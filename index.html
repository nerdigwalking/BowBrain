<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BowBrain – Your Archery Companion</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8a020'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%230f1117' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%230f1117' stroke-width='1.7'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%230f1117'/%3E%3Cpath d='M16 4.6 Q19.4 8.6 16.8 12.4' fill='none' stroke='%230f1117' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M16 4.6 Q12.6 8.6 15.2 12.4' fill='none' stroke='%230f1117' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e8a020'/%3E%3Ccircle cx='16' cy='16' r='11.5' fill='none' stroke='%230f1117' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%230f1117' stroke-width='1.7'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%230f1117'/%3E%3Cpath d='M16 4.6 Q19.4 8.6 16.8 12.4' fill='none' stroke='%230f1117' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M16 4.6 Q12.6 8.6 15.2 12.4' fill='none' stroke='%230f1117' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#e8a020">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--bg4:#252b3b;--accent:#e8a020;--a2:#f0c060;--green:#2dd4a0;--red:#e85050;--blue:#4a9eff;--text:#f0f0f0;--text2:#9aa0b8;--text3:#6a7090;--border:#2a3050;--bd2:#3a4060;--card:#1e2333;font-family:'Inter',sans-serif;font-size:14px}
body.light{--bg:#eef1f8;--bg2:#fff;--bg3:#f4f6fc;--bg4:#e8ecf5;--text:#1a1e30;--text2:#4a5272;--text3:#7a8aaa;--border:#c5cce6;--bd2:#a5b0d0;--card:#fff}
body.large-font{font-size:15.5px}
body.compact .card,.compact .card-sm{padding:12px 14px}
body.compact .content{padding:14px}
body.no-anim *{transition:none!important;animation:none!important}
body{background:var(--bg);color:var(--text);min-height:100vh}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes medalPop{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.4) rotate(8deg);opacity:1}80%{transform:scale(0.9) rotate(-3deg)}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes slideInL{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.fade-in{animation:fadeInUp .28s ease-out both}
.slide-in{animation:slideInL .22s ease-out both}
.medal-burst{animation:medalPop .8s cubic-bezier(0.34,1.56,0.64,1) forwards;display:inline-block}
.card-hover{transition:border-color .15s,transform .15s}
.card-hover:hover{border-color:var(--accent)!important;transform:translateY(-1px)}
/* ─── Login ─── */
.lp{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.lbg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,#e8a02018 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,#4a9eff10 0%,transparent 45%);pointer-events:none}
.lbox{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:32px 28px;width:420px;max-width:95vw;position:relative;z-index:1;animation:fadeInUp .35s ease-out}
.llogo{display:flex;align-items:center;gap:12px;margin-bottom:20px;justify-content:center}
.lico{width:44px;height:44px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lico svg{width:28px;height:28px}
.ltit{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:2px;color:var(--accent)}
.lslogan{font-size:13px;color:var(--text2);text-align:center;margin:-2px 0 18px;letter-spacing:0.5px;font-style:italic}
.lver{font-size:11px;color:var(--text3);text-align:center;margin:18px 0 0;letter-spacing:0.5px}
.lerr{background:#e8505018;border:1px solid #e8505040;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.lsuc{background:#2dd4a018;border:1px solid #2dd4a040;color:var(--green);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.ldemo{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:12px}
.demo-btn{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;cursor:pointer;border:1px solid var(--border);background:var(--bg4);margin-top:5px;transition:all .15s}
.demo-btn:hover{border-color:var(--accent);background:var(--bg3)}
.ltabs{display:flex;gap:3px;background:var(--bg3);padding:3px;border-radius:10px;margin-bottom:16px}
.ltab{flex:1;padding:7px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;border:none;background:none;font-family:'Inter',sans-serif;transition:all .15s}
.ltab.active{background:var(--bg);color:var(--text);font-weight:600}
/* ─── App layout ─── */
.app{display:flex;min-height:100vh}
.sidebar{width:222px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;transition:transform .3s}
.sidebar.collapsed{transform:translateX(-222px)}
.main{margin-left:222px;flex:1;min-height:100vh;transition:margin .3s}
.main.exp{margin-left:0}
.logo{padding:16px 14px 13px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:22px;height:22px}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1.5px;color:var(--accent)}
.logo-ver{font-size:10px;color:var(--text3)}
.nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,#e8a020,#f0c060);color:#0f1117;font-weight:700}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-sep{height:1px;background:var(--border);margin:6px 0}
.nav-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:3px 10px 5px;font-weight:600}
.sf{padding:10px 8px;border-top:1px solid var(--border)}
.uc{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;background:var(--bg3)}
.avw{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0f1117;flex-shrink:0;overflow:hidden}
.avw img{width:100%;height:100%;object-fit:cover}
.topbar{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
.tbt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--accent);flex:1}
.tb-logo{display:none;width:28px;height:28px;border-radius:8px;background:var(--accent);padding:3px;flex-shrink:0}
.tb-logo svg{width:100%;height:100%}
@media(max-width:767px){.tb-logo{display:block}.tbt{font-size:17px}}
.tbb{background:var(--bg4);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:11px;color:var(--text2);font-weight:500}
.mb{background:none;border:none;color:var(--text2);cursor:pointer;padding:5px;border-radius:6px;display:flex;transition:background .15s}
.mb:hover{background:var(--bg3);color:var(--text)}
.content{padding:20px;max-width:1200px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;transition:border-color .15s}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ct{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px}
.cv{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--text)}
.cs{font-size:12px;color:var(--text3);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif}
.bp{background:var(--accent);color:#0f1117}.bp:hover{background:var(--a2);transform:translateY(-1px)}
.bg{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}.bg:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.bd{background:transparent;color:var(--red);border:1px solid #e8505030}.bd:hover{background:#e8505018}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.ba{background:#e8a02030;color:var(--accent);border:1px solid #e8a02050}
.bgr{background:#2dd4a020;color:var(--green);border:1px solid #2dd4a030}
.brd{background:#e8505020;color:var(--red);border:1px solid #e8505030}
.bbl{background:#4a9eff20;color:var(--blue);border:1px solid #4a9eff30}
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.ti{position:relative;margin-bottom:16px;animation:fadeInUp .2s ease-out both}
.tdot{position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg2);z-index:1}
.dg{background:var(--accent)}.dgr{background:var(--green)}.db{background:var(--blue)}
.tc{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.progress{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;transition:width .4s ease}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:var(--text3);padding:7px 10px;border-bottom:1px solid var(--border)}
.table td{padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--bg3);color:var(--text)}
.fg{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--bg3)}
textarea{min-height:70px;resize:vertical}
.tabs{display:flex;gap:3px;margin-bottom:18px;background:var(--bg3);padding:3px;border-radius:10px}
.tab{flex:1;padding:6px 8px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;border:none;background:none;font-family:'Inter',sans-serif}
.tab.active{background:var(--bg);color:var(--text);font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:fadeIn .15s ease-out}
.md{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px;width:520px;max-width:95vw;max-height:88vh;overflow-y:auto;animation:fadeInUp .2s ease-out}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mt2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--accent)}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;color:var(--text);margin-bottom:18px}
.ssub{font-size:13px;color:var(--text3);margin-top:-14px;margin-bottom:18px}
.empty{text-align:center;padding:36px 20px;color:var(--text3)}
.ei{font-size:42px;margin-bottom:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--bg4);border:1px solid var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on::after{left:19px}
.ndot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:auto;animation:pulse 1.5s ease-in-out infinite}
.vtag{position:fixed;bottom:10px;right:10px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:10px;color:var(--text3);z-index:300}
@media(max-width:767px){.vtag{position:static;display:block;margin:18px auto 4px;width:fit-content;font-size:9px;padding:2px 8px;opacity:0.75;z-index:auto}}
.tcard{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.tcti{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:8px}
.gi{padding:10px 0;border-bottom:1px solid var(--border)}
.gi:last-child{border-bottom:none}
.gterm{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:4px}
.gdef{font-size:13px;color:var(--text2);line-height:1.6}
.faq-item{border:1px solid var(--border);border-radius:10px;margin-bottom:7px;overflow:hidden}
.faq-q{padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--text);gap:8px}
.faq-a{padding:0 14px 10px;font-size:13px;color:var(--text2);line-height:1.65;display:none}
.faq-item.open .faq-a{display:block}
.fq{transition:transform .2s;color:var(--text3);flex-shrink:0}
.faq-item.open .fq{transform:rotate(180deg)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo-card{background:var(--bg4);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.photo-card img{width:100%;height:86px;object-fit:cover}
.pmeta{padding:5px 7px;font-size:11px;color:var(--text2)}
.pdate{color:var(--text3);font-size:10px;margin-bottom:1px}
.pdel{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);border:none;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
.color-sw{width:26px;height:26px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:border .1s;display:inline-block}
.color-sw.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent)}
.roadmap-item{padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.rm-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.changelog-item{padding:12px 0;border-bottom:1px solid var(--border)}
.changelog-item:last-child{border-bottom:none}
.cl-ver{font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--accent);letter-spacing:1px}
.ob-step{display:none}.ob-step.active{display:block;animation:fadeInUp .25s ease-out}
.ob-prog{display:flex;gap:6px;margin-bottom:18px}
.ob-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s}
.ob-dot.done{background:var(--accent)}
.notif-planned{opacity:0.35;pointer-events:none;position:relative}
/* ─── Mobile ─── */
@media(max-width:767px){
  .sidebar{width:100%;height:auto;min-height:58px;flex-direction:row;position:fixed!important;bottom:0!important;top:auto!important;left:0;right:0;transform:none!important;border-right:none;border-top:1px solid var(--border);z-index:200;padding-bottom:env(safe-area-inset-bottom,0px)}
  .sidebar.collapsed{transform:none!important}
  .logo,.sf{display:none}
  .nav{display:flex;flex-direction:row;overflow-x:auto;padding:4px 2px;align-items:center;justify-content:space-around;width:100%}
  .nav{scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-item{flex-direction:column;gap:1px;font-size:9px;padding:4px 6px;min-width:44px;max-width:54px;border-radius:8px;text-align:center;overflow:hidden}
  .nav-item span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:9px;line-height:1.1}
  .nav-item svg{width:18px;height:18px;flex-shrink:0}
  .nav-lbl,.nav-sep{display:none}
  .ndot{position:absolute;top:2px;right:2px;margin-left:0}
  .nav-item{position:relative}
  .main{margin-left:0!important;padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  .g4{grid-template-columns:1fr 1fr!important}
  .g3{grid-template-columns:1fr 1fr!important}
  .g2{grid-template-columns:1fr!important}
  .stitle{font-size:22px!important;margin-bottom:12px!important}
  .content{padding:12px!important}
  .topbar{padding:0 12px;gap:8px}
  .md{max-height:85vh;padding:16px}
  .tabs{flex-wrap:wrap}
  .tab{min-width:calc(50% - 4px);flex:none}
  .photo-grid{grid-template-columns:1fr 1fr}
  /* Tuning diagrams: keep them legible instead of squeezing them into 340px */
  .tcard{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tcard>svg{min-width:520px;height:auto}
  .tsvg-hint{display:block}
}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
</style>
</head>
<body>
<!-- LOGIN PAGE -->
<div id="login-page">
<div class="lp"><div class="lbg"></div>
<div class="lbox">
  <div class="llogo">
    <div class="lico">
      <svg viewBox="0 0 44 44" fill="none">
        <circle cx="22" cy="22" r="17" stroke="#0f1117" stroke-width="2"/>
        <circle cx="22" cy="22" r="11" stroke="#0f1117" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="5" stroke="#0f1117" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="2" fill="#0f1117" opacity="0.5"/>
        <path d="M22,6 Q26,14 22,22 Q18,14 22,6" fill="none" stroke="#0f1117" stroke-width="1.8"/>
        <path d="M12,10 Q16,18 14,26" stroke="#0f1117" stroke-width="1.2" opacity="0.7"/>
        <path d="M32,10 Q28,18 30,26" stroke="#0f1117" stroke-width="1.2" opacity="0.7"/>
        <path d="M14,26 Q18,32 22,30 Q26,32 30,26" stroke="#0f1117" stroke-width="1.3" opacity="0.7"/>
      </svg>
    </div>
    <div class="ltit">BowBrain</div>
  </div>
  <div class="lslogan">Your Archery Companion</div>
  <div id="maint-banner" style="display:none;background:#e8a02018;border:1px solid #e8a020;border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:13px;color:var(--text);line-height:1.6"></div>
  <div id="login-body"></div>
  <div class="lver">v1.0.0.13 &middot; &ldquo;Lisa Barbelin&rdquo;</div>
</div></div>
</div>
<!-- APP SHELL -->
<div id="app-shell" style="display:none">
<div class="app">
<nav class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logo-icon">

function mergeChangelog(builtin,db){if(!Array.isArray(db)||!db.length)return builtin;const dbMap={};db.forEach(e=>{if(e&&e.ver)dbMap[e.ver]=e;});const biVers=new Set(builtin.map(e=>e.ver));const merged=builtin.map(e=>dbMap[e.ver]?normalizeCL(dbMap[e.ver],e):e);const extra=db.filter(e=>e&&e.ver&&!biVers.has(e.ver)).map(e=>normalizeCL(e,null));return [...extra,...merged];}

function predictClick(newDist,pts){if(pts.length<2)return null;const n=pts.length,sx=pts.reduce((s,p)=>s+p.dist,0),sy=pts.reduce((s,p)=>s+p.click,0),sxy=pts.reduce((s,p)=>s+p.dist*p.click,0),sx2=pts.reduce((s,p)=>s+p.dist*p.dist,0),den=n*sx2-sx*sx;if(!den)return null;const slope=(n*sxy-sx*sy)/den,int=(sy-slope*sx)/n,pred=Math.round(slope*newDist+int);return pred>0?pred:null;}
function interpMark(dist,pts){
  if(!pts||!pts.length)return null;
  const P=pts.slice().sort((a,b)=>a.dist-b.dist);
  const ex=P.find(p=>p.dist===dist);if(ex)return{value:ex.click,mode:'exact'};
  if(P.length===1)return{value:P[0].click,mode:'single'};
  const mn=P[0],mx=P[P.length-1];
  if(dist<mn.dist){const a=P[0],b=P[1],sl=(b.click-a.click)/(b.dist-a.dist);return{value:a.click+sl*(dist-a.dist),mode:'extrap'};}
  if(dist>mx.dist){const a=P[P.length-2],b=P[P.length-1],sl=(b.click-a.click)/(b.dist-a.dist);return{value:b.click+sl*(dist-b.dist),mode:'extrap'};}
  for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];if(dist>=a.dist&&dist<=b.dist){const sl=(b.click-a.click)/(b.dist-a.dist);return{value:a.click+sl*(dist-a.dist),mode:'interp'};}}
  return null;
}

function setDashMode(v){DASH_MODE=v;try{localStorage.setItem('bb_dash_mode',v);}catch(e){}navigate('dashboard');}
function isMultiDist(type){return !!(TT[type]&&TT[type].multi);}
// Comparison group: multi-distance formats compare by FORMAT, others by distance
function cmpGroup(s){if(isMultiDist(s.type))return 'fmt:'+s.type;return s.distance?String(s.distance):'none';}
function cmpGroupLabel(k){
  if(k.startsWith('fmt:')){const tt=TT[k.slice(4)];return (tt?(tt[lang]||tt.de):k.slice(4))+(lang==='de'?' (Format)':' (format)');}
  if(k==='none')return lang==='de'?'ohne Entfernung':'no distance';
  return k+' m';
}
function dashDistances(){const map={};getD().scores.filter(s=>DASH_MODE==='score'?(!s.no_points&&s.points>0):((s.arrows||0)>0)).forEach(s=>{const k=cmpGroup(s);map[k]=(map[k]||0)+1;});return map;}

function fitLabel(ctx,text,maxW){if(maxW<=2)return'';if(ctx.measureText(text).width<=maxW)return text;let s=text;while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…';}
function hideDashTip(){const tp=document.getElementById('dash-tip');if(tp)tp.style.display='none';}
function dashTip(ev){const cv=document.getElementById('score-canvas'),C=window.__dashChart;if(!cv||!C||!C.all||!C.all.length){hideDashTip();return;}
  const rect=cv.getBoundingClientRect();const cx=(ev.touches&&ev.touches[0]?ev.touches[0].clientX:ev.clientX);const cy=(ev.touches&&ev.touches[0]?ev.touches[0].clientY:ev.clientY);
  let i=Math.round((cx-rect.left-C.x0)/C.slot-0.5);i=Math.max(0,Math.min(C.all.length-1,i));const s=C.all[i];if(!s){hideDashTip();return;}
  const mx=maxScore(s.type);let tp=document.getElementById('dash-tip');
  if(!tp){tp=document.createElement('div');tp.id='dash-tip';tp.style.cssText='position:fixed;z-index:600;pointer-events:none;background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12px;color:var(--text);box-shadow:0 6px 22px rgba(0,0,0,0.45);max-width:220px';document.body.appendChild(tp);}
  const title=s.name||(s.type==='training'?'Training':(TT[s.type]?.[lang]||s.type));
  const val=s.no_points?`${s.arrows} ${t('arrows')}`:`${s.points}${mx?'/'+mx:''} · ${s.arrows} ${t('arrows')}`;
  tp.innerHTML=`<div style="font-weight:600;margin-bottom:2px">${title}${medal(s.placement)?' '+medal(s.placement):''}</div><div style="color:var(--text3);font-size:11px">${fd(s.date)}${s.location?' · '+s.location:''}</div><div style="color:var(--text2);font-size:11px;margin-top:3px">${val} · ${getSName(s.setup_id)}</div>`;
  tp.style.display='block';
  let tx=cx+13,ty=cy+13;tx=Math.min(tx,window.innerWidth-tp.offsetWidth-8);ty=Math.min(ty,window.innerHeight-tp.offsetHeight-8);tp.style.left=tx+'px';tp.style.top=ty+'px';}
function drawLineChart(){
  const cv=document.getElementById('score-canvas');if(!cv)return;
  const sel=DASH_DIST;
  const inGroup=s=>(sel===null||sel==='all')?true:cmpGroup(s)===String(sel);
  const showScore=DASH_MODE!=='arrows',showArr=DASH_MODE!=='score';
  // entries: scored ones for the lines; all (incl. arrows-only) when arrows are shown
  const pool=getD().scores.filter(s=>inGroup(s)).filter(s=>showArr?((s.arrows||0)>0):(!s.no_points&&s.points>0));
  const all=pool.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-12);
  const W=cv.offsetWidth||600,H=150;cv.width=W*2;cv.height=H*2;const ctx=cv.getContext('2d');if(!ctx)return;ctx.scale(2,2);ctx.clearRect(0,0,W,H);
  const hasNm=all.some(s=>(s.name||'').trim());const ml=38,mr=showArr&&showScore?34:16,mt=28,mb=hasNm?31:22,cW=W-ml-mr,cH=H-mt-mb;
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=mt+i*cH/4;ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(W-mr,y);ctx.stroke();
    if(showScore){ctx.fillStyle='rgba(106,112,144,0.55)';ctx.font='9px Inter,sans-serif';ctx.textAlign='right';ctx.fillText((100-i*25)+'%',ml-3,y+3);}}
  if(!all.length){ctx.fillStyle='rgba(106,112,144,0.6)';ctx.font='13px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(lang==='de'?'Keine Ergebnisse in dieser Gruppe':'No results in this group',W/2,H/2);return;}
  const n=all.length;
  // Cap how wide a single slot may become, otherwise 1-3 entries drift far apart.
  const slot=Math.min(cW/n,78);
  const groupW=slot*n;
  const x0=ml+(cW-groupW)/2;          // centre the group horizontally
  const toX=idx=>x0+slot*(idx+0.5);   // centre of the slot (never on the axis)
  const toY=pct=>mt+(1-pct)*cH;
  window.__dashChart={x0,slot,all};cv.onmousemove=dashTip;cv.onmouseleave=hideDashTip;cv.ontouchstart=dashTip;cv.ontouchmove=dashTip;cv.style.cursor='crosshair';
  // ── arrows as bars (own scale) ──
  if(showArr){
    const maxA=Math.max(1,...all.map(s=>+s.arrows||0));
    const bw=Math.max(4,Math.min(26,slot*0.55));
    const LBL=11;               // headroom reserved for the value label
    const barMax=Math.max(6,cH-LBL);
    all.forEach((s,i)=>{const a=+s.arrows||0;if(!a)return;
      const h=Math.max(2,(a/maxA)*barMax);
      let x=toX(i)-bw/2;
      x=Math.max(ml+1,Math.min(x,W-mr-bw-1)); // keep bars inside the plot area
      const y=mt+cH-h;
      ctx.fillStyle=s.no_points?'rgba(74,158,255,0.45)':'rgba(74,158,255,0.22)';
      ctx.fillRect(x,y,bw,h);
      if(!showScore||s.no_points){
        ctx.font='8px Inter,sans-serif';ctx.textAlign='center';
        const wide=bw>=15;
        if(h>=20&&wide){ // tall enough: label sits inside the bar, never on top of it
          ctx.fillStyle='rgba(230,240,255,0.95)';ctx.fillText(a,x+bw/2,y+10);
        } else {          // short bar: label above, always inside the plot
          ctx.fillStyle='rgba(74,158,255,0.95)';ctx.fillText(a,x+bw/2,Math.max(mt+8,y-3));
        }
      }
    });
    if(!showScore){ // arrows axis labels on the left
      for(let i=0;i<=4;i++){const y=mt+i*cH/4;ctx.fillStyle='rgba(106,112,144,0.55)';ctx.font='9px Inter,sans-serif';ctx.textAlign='right';ctx.fillText(Math.round(maxA*(1-i/4)),ml-3,y+3);}
    } else { // right-hand axis for arrows
      for(let i=0;i<=4;i++){const y=mt+i*cH/4;ctx.fillStyle='rgba(74,158,255,0.5)';ctx.font='9px Inter,sans-serif';ctx.textAlign='left';ctx.fillText(Math.round(maxA*(1-i/4)),W-mr+3,y+3);}
    }
  }
  // ── score lines ──
  function drawSeries(series,color){
    if(!series.length)return;
    const pts=series.map(s=>{const idx=all.findIndex(a=>a.id===s.id),mx=maxScore(s.type)||s.points;return{x:toX(idx),y:toY(Math.min(1,s.points/mx)),s};});
    const gr=ctx.createLinearGradient(0,mt,0,mt+cH);gr.addColorStop(0,color+'25');gr.addColorStop(1,color+'05');
    ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(pts[0].x,toY(0));
    pts.forEach((p,i)=>{if(i===0){ctx.lineTo(p.x,p.y);}else{const pp=pts[i-1],cpx=(pp.x+p.x)/2;ctx.bezierCurveTo(cpx,pp.y,cpx,p.y,p.x,p.y);}});
    ctx.lineTo(pts[pts.length-1].x,toY(0));ctx.closePath();ctx.fill();
    ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.shadowColor=color+'55';ctx.shadowBlur=5;ctx.beginPath();
    pts.forEach((p,i)=>{if(i===0){ctx.moveTo(p.x,p.y);}else{const pp=pts[i-1],cpx=(pp.x+p.x)/2;ctx.bezierCurveTo(cpx,pp.y,cpx,p.y,p.x,p.y);}});
    ctx.stroke();ctx.shadowBlur=0;
    pts.forEach(p=>{
      ctx.fillStyle=color;ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill();
      ctx.font='8px Inter,sans-serif';ctx.textAlign='center';
      const above=p.y-9>=mt+8;               // enough room above the dot?
      const ly=above?p.y-9:p.y+13;
      // faint backing so the number stays readable over a bar
      const txt=String(avgArr(p.s.points,p.s.arrows));
      const tw=ctx.measureText(txt).width;
      ctx.fillStyle='rgba(15,17,23,0.55)';ctx.fillRect(p.x-tw/2-2,ly-8,tw+4,10);
      ctx.fillStyle='rgba(240,240,240,0.95)';ctx.fillText(txt,p.x,ly);
      if(p.s.placement&&p.s.placement<=3){
        ctx.font='10px Arial';
        const my=above?(p.y-19>=mt+8?p.y-19:p.y+25):p.y+25;
        ctx.fillText(medal(p.s.placement),p.x,my);
      }
    });
  }
  if(showScore){
    const scored=all.filter(s=>!s.no_points&&s.points>0);
    drawSeries(scored.filter(s=>s.type!=='training'),'#e8a020');
    drawSeries(scored.filter(s=>s.type==='training'),'#2dd4a0');
  }
  ctx.fillStyle='rgba(106,112,144,0.6)';ctx.font='8px Inter,sans-serif';ctx.textAlign='center';
  all.forEach((s,i)=>{const x=toX(i);ctx.textAlign='center';ctx.font='8px Inter,sans-serif';ctx.fillStyle='rgba(106,112,144,0.6)';ctx.fillText(fd(s.date).substring(0,5),x,mt+cH+11);const nm=(s.name||'').trim();if(nm){ctx.fillStyle='rgba(154,160,184,0.85)';ctx.fillText(fitLabel(ctx,nm,slot-4),x,mt+cH+20);}});
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ml,mt+cH);ctx.lineTo(W-mr,mt+cH);ctx.stroke();
}

function swT(id){['bs','wb','pp','nt','ph'].forEach(k=>{const el=document.getElementById('tc-'+k);if(el)el.style.display=k===id?'':'none';const tab=document.getElementById('tab-'+k);if(tab)tab.classList.toggle('active',k===id);});}
function editTT(tab){document.body.insertAdjacentHTML('beforeend',`<div class="mo" id="tt-mo" onclick="closeMo(event,'tt-mo')"><div class="md" style="width:500px"><div class="mh"><div class="mt2">${lang==='de'?'Text bearbeiten':'Edit Text'}</div><button class="btn bg btn-sm" onclick="document.getElementById('tt-mo').remove()">✕</button></div><div class="fg"><label>Deutsch</label><textarea id="tt-de" style="min-height:80px">${SHARED.tuning[tab+'_de']}</textarea></div><div class="fg"><label>English</label><textarea id="tt-en" style="min-height:80px">${SHARED.tuning[tab+'_en']}</textarea></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn bg" onclick="document.getElementById('tt-mo').remove()">${t('cancel')}</button><button class="btn bp" onclick="saveTT('${tab}')">${t('save')}</button></div></div></div>`);}
async function saveTT(tab){SHARED.tuning[tab+'_de']=document.getElementById('tt-de')?.value;SHARED.tuning[tab+'_en']=document.getElementById('tt-en')?.value;document.getElementById('tt-mo').remove();navigate('tuning');setTimeout(()=>swT(tab),50);saveShared();}
async function saveTN(){const el=document.getElementById('tn-ta');if(!el)return;getD().tuning_notes=el.value;const {error}=await sbc.from('tuning').upsert({user_id:CU.id,notes:el.value},{onConflict:'user_id'});if(error){toast(error.message);return;}const btn=document.querySelector('[onclick="saveTN()"]');if(btn){btn.textContent='✅';setTimeout(()=>{btn.textContent=t('save')},1500);}}
function addPhoto(input){if(!input.files||!input.files[0])return;const comment=document.getElementById('ph-comment')?.value||'';const reader=new FileReader();reader.onload=async e=>{const date=new Date().toLocaleDateString(lang==='de'?'de-DE':'en-GB');const rec=await dbIns('tuning_photos',{user_id:CU.id,data_url:e.target.result,date,comment});if(!rec)return;getD().tuning_photos.push({id:rec.id,dataUrl:rec.data_url,date:rec.date,comment:rec.comment});const ci=document.getElementById('ph-comment');if(ci)ci.value='';navigate('tuning');setTimeout(()=>swT('ph'),50);};reader.readAsDataURL(input.files[0]);}
async function delPhoto(id){if(!confirm(t('confirm_del')))return;if(!await dbDel('tuning_photos',id))return;getD().tuning_photos=getD().tuning_photos.filter(p=>p.id!==id);navigate('tuning');setTimeout(()=>swT('ph'),50);}

const GL={de:[{id:1,t:'Spine',d:'Maß für Biegsamkeit. Niedrigerer Wert = steiferer Pfeil.'},{id:2,t:'Auszuglänge',d:'Distanz, die der Schütze den Bogen auszieht, in Zoll.'},{id:3,t:'Blankschaft-Tuning',d:'Unbefiederte Pfeile: Links/Rechts = Spine; Oben/Unten = Nockpunkt.'},{id:4,t:'Walkback-Tuning',d:'Pfeile auf senkrechten Streifen aus verschiedenen Entfernungen.'},{id:5,t:'Paper Tuning',d:'Pfeil durch Papier – Rissbild zeigt Korrekturen.'},{id:6,t:'Nockpunkt',d:'Punkt auf der Sehne, wo der Pfeil eingenocht wird.'},{id:7,t:'Standhöhe (Brace Height)',d:'Abstand Sehne–Griffstück. Typisch 8–9,5 Zoll.'},{id:8,t:'Tiller',d:'Abstand Wurfarmende–Sehne. Oberer Tiller typisch 2–4mm größer.'},{id:9,t:'Clicker',d:'Metallblättchen: klickt bei optimaler Auszuglänge.'},{id:10,t:'WA 720',d:'Outdoor-Format. 72 Pfeile, max. 720 Punkte (50m+30m).'},{id:11,t:'WA 600',d:'Indoor-Format. 60 Pfeile, max. 600 Punkte auf 18m oder 25m.'}],en:[{id:1,t:'Spine',d:'Measure of arrow stiffness. Lower = stiffer arrow.'},{id:2,t:'Draw Length',d:'Distance the archer draws the bow, in inches.'},{id:3,t:'Bare Shaft Tuning',d:'Bare shafts: Left/Right = spine; Up/Down = nocking point.'},{id:4,t:'Walkback Tuning',d:'Arrows on a vertical strip from different distances.'},{id:5,t:'Paper Tuning',d:'Arrow through paper – tear pattern shows corrections.'},{id:6,t:'Nocking Point',d:'Point on string where arrow is nocked.'},{id:7,t:'Brace Height',d:'String to grip distance. Typical 8–9.5 inches.'},{id:8,t:'Tiller',d:'Limb tip to string distance. Upper typically 2–4mm larger.'},{id:9,t:'Clicker',d:'Metal blade: clicks at optimal draw length.'},{id:10,t:'WA 720',d:'Outdoor format. 72 arrows, max 720 points (50m+30m).'},{id:11,t:'WA 600',d:'Indoor format. 60 arrows, max 600 points at 18m/25m.'}]};
let GL_FILTER_LABEL=null;
function glArgLit(v){return v===null?'null':(typeof v==='number'?v:`'${v}'`);}
function glItemLabelIds(id){const m=SHARED.gl_item_labels||{};return m[id]||[];}
function glGroupMatches(id,labelId){const ids=glItemLabelIds(id);return labelId==='none'?ids.length===0:ids.includes(labelId);}
function glossaryFilterBarHTML(){
  const labels=SHARED.gl_labels||[];
  if(!labels.length)return'';
  return`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px" id="g-filterbar">
    <button class="btn ${GL_FILTER_LABEL===null?'bp':'bg'} btn-sm" onclick="setGLFilter(null)">${lang==='de'?'Alle':'All'}</button>
    ${labels.map(lb=>`<button class="btn ${GL_FILTER_LABEL===lb.id?'bp':'bg'} btn-sm" onclick="setGLFilter(${lb.id})">${lang==='de'?lb.de:lb.en}</button>`).join('')}
    <button class="btn ${GL_FILTER_LABEL==='none'?'bp':'bg'} btn-sm" onclick="setGLFilter('none')">${lang==='de'?'Ohne Label':'No label'}</button>
  </div>`;
}
function glossaryItemHTML(g,isAdmin,showArrows,groupLabelId,idx,groupLen){
  return`<div class="gi" id="gi-${g.id}">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
      <div><div class="gterm">${g.t}</div><div class="gdef">${g.d}</div></div>
      ${isAdmin?`<div style="display:flex;gap:5px;flex-shrink:0;margin-top:2px">
        ${showArrows?`<button class="btn bg btn-sm" onclick="moveGLInGroup(${g.id},-1,${glArgLit(groupLabelId)})" ${idx===0?'disabled':''} title="${lang==='de'?'Nach oben':'Move up'}" style="padding:2px 6px">▲</button>
        <button class="btn bg btn-sm" onclick="moveGLInGroup(${g.id},1,${glArgLit(groupLabelId)})" ${idx===groupLen-1?'disabled':''} title="${lang==='de'?'Nach unten':'Move down'}" style="padding:2px 6px">▼</button>`:''}
        <button class="btn bg btn-sm" onclick="editGlossarItem(${g.id})" style="padding:2px 7px">✏️</button>
        <button class="btn bd btn-sm" onclick="delGlossarItem(${g.id})" style="padding:2px 7px">🗑</button>
      </div>`:''}
    </div>
  </div>`;
}
function glossaryListHTML(){
  const q=(document.getElementById('g-s')?.value||'').trim().toLowerCase();
  const isAdmin=CU&&CU.role==='admin';
  const allItems=GL[lang]||GL.de;
  const matchesQ=g=>!q||g.t.toLowerCase().includes(q)||g.d.toLowerCase().includes(q);
  if(!q&&GL_FILTER_LABEL===null){
    const labels=SHARED.gl_labels||[];
    const groups=[];
    labels.forEach(lb=>{const gi=allItems.filter(g=>glGroupMatches(g.id,lb.id));if(gi.length)groups.push({id:lb.id,name:lang==='de'?lb.de:lb.en,items:gi});});
    const noneItems=allItems.filter(g=>glGroupMatches(g.id,'none'));
    if(noneItems.length)groups.push({id:'none',name:lang==='de'?'Ohne Label':'No label',items:noneItems});
    if(!groups.length)return`<div class="card"><div style="padding:12px;color:var(--text3)">${lang==='de'?'Noch keine Einträge.':'No entries yet.'}</div></div>`;
    if(groups.length===1){
      const items=groups[0].items;
      return`<div class="card">${items.map((g,idx)=>glossaryItemHTML(g,isAdmin,isAdmin,null,idx,items.length)).join('')}</div>`;
    }
    return groups.map((grp,gidx)=>`<div style="margin:${gidx?'18px':'0'} 0 8px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em">${grp.name}</div><div class="card" style="margin-bottom:0">${grp.items.map((g,idx)=>glossaryItemHTML(g,isAdmin,isAdmin,grp.id,idx,grp.items.length)).join('')}</div>`).join('');
  }
  const pool=allItems.filter(g=>(GL_FILTER_LABEL===null||glGroupMatches(g.id,GL_FILTER_LABEL))&&matchesQ(g));
  const showArrows=isAdmin&&!q&&GL_FILTER_LABEL!==null;
  return`<div class="card">${pool.length?pool.map((g,idx)=>glossaryItemHTML(g,isAdmin,showArrows,GL_FILTER_LABEL,idx,pool.length)).join(''):`<div style="padding:12px;color:var(--text3)">${lang==='de'?'Kein Ergebnis.':'No results.'}</div>`}</div>`;
}

async function moveGLInGroup(id,dir,labelId){
  const de=GL.de;
  const groupIds=(labelId===null?de:de.filter(g=>glGroupMatches(g.id,labelId))).map(g=>g.id);
  const gi=groupIds.indexOf(id),gj=gi+dir;
  if(gi<0||gj<0||gj>=groupIds.length)return;
  const otherId=groupIds[gj];
  const i1=de.findIndex(g=>g.id===id),i2=de.findIndex(g=>g.id===otherId);
  const tmp=de[i1];de[i1]=de[i2];de[i2]=tmp;
  const order=de.map(g=>g.id);
  GL.en=order.map(oid=>GL.en.find(g=>g.id===oid)).filter(Boolean).concat(GL.en.filter(g=>!order.includes(g.id)));
  await saveShared();navigate('glossar');
}

async function saveGlossarItem(id){
  const deT=document.getElementById('gl-de-t')?.value?.trim();const deD=document.getElementById('gl-de-d')?.value?.trim();
  const enT=document.getElementById('gl-en-t')?.value?.trim();const enD=document.getElementById('gl-en-d')?.value?.trim();
  if(!deT||!deD)return;
  const checked=[...document.querySelectorAll('.gl-lbl-cb:checked')].map(cb=>parseInt(cb.value,10));
  let nid=id;
  if(id){
    GL.de=GL.de.map(g=>g.id===id?{...g,t:deT,d:deD}:g);
    GL.en=GL.en.map(g=>g.id===id?{...g,t:enT||deT,d:enD||deD}:g);
  } else {
    nid=Math.max(...GL.de.map(g=>g.id),0)+1;
    GL.de.push({id:nid,t:deT,d:deD});
    GL.en.push({id:nid,t:enT||deT,d:enD||deD});
  }
  if(!SHARED.gl_item_labels)SHARED.gl_item_labels={};
  if(checked.length){SHARED.gl_item_labels[nid]=checked;}else{delete SHARED.gl_item_labels[nid];}
  document.getElementById('gl-mo').remove();navigate('glossar');saveShared();
}
async function delGlossarItem(id){
  if(!confirm(t('confirm_del')))return;
  GL.de=GL.de.filter(g=>g.id!==id);GL.en=GL.en.filter(g=>g.id!==id);
  if(SHARED.gl_item_labels)delete SHARED.gl_item_labels[id];
  navigate('glossar');saveShared();
}

function swH(id){['faq','fb','rm','do','im'].forEach(k=>{const el=document.getElementById('hc-'+k);if(el)el.style.display=k===id?'':'none';const tab=document.getElementById('ht-'+k);if(tab)tab.classList.toggle('active',k===id);});}
async function addVName(){
  const name=document.getElementById('vn-name')?.value?.trim();
  const note=document.getElementById('vn-note')?.value?.trim()||'';
  if(!name){toast(lang==='de'?'Bitte einen Namen eingeben.':'Please enter a name.');return;}
  if(!Array.isArray(SHARED.version_names))SHARED.version_names=[];
  if(SHARED.version_names.some(v=>v.name.toLowerCase()===name.toLowerCase())){toast(lang==='de'?'Dieser Name steht schon auf der Liste.':'That name is already on the list.');return;}
  SHARED.version_names.push({name,note,used:false,added:new Date().toISOString().slice(0,10)});
  await saveShared();navigate('admin');
}
async function delVName(i){
  if(!confirm(t('confirm_del')))return;
  SHARED.version_names.splice(i,1);await saveShared();navigate('admin');
}
async function markVNameUsed(i){
  const v=SHARED.version_names[i];if(!v)return;
  const ver=prompt(lang==='de'?'In welcher Version verwendet?':'Used in which version?',VER);
  if(ver===null)return;
  v.used=true;v.usedIn=ver.trim()||VER;
  await saveShared();navigate('admin');
}
async function moveVName(i,dir){
  const j=i+dir;const a=SHARED.version_names;
  if(!a||j<0||j>=a.length)return;
  const tmp=a[i];a[i]=a[j];a[j]=tmp;
  await saveShared();navigate('admin');
}
async function toggleAnnouncement(){
  if(!SHARED.announcement)SHARED.announcement={active:false,id:0,title_de:'',title_en:'',text_de:'',text_en:''};
  SHARED.announcement.active=!SHARED.announcement.active;
  if(SHARED.announcement.active&&!SHARED.announcement.id)SHARED.announcement.id=Date.now();
  await saveShared();
  toast(SHARED.announcement.active?(lang==='de'?'Mitteilung aktiviert.':'Announcement enabled.'):(lang==='de'?'Mitteilung deaktiviert.':'Announcement disabled.'),true);
  navigate('admin');
}
async function saveAnnouncement(){
  if(!SHARED.announcement)SHARED.announcement={active:false,id:0};
  const a=SHARED.announcement;
  a.title_de=document.getElementById('ann-tde')?.value?.trim()||'';
  a.title_en=document.getElementById('ann-ten')?.value?.trim()||'';
  a.text_de=document.getElementById('ann-xde')?.value||'';
  a.text_en=document.getElementById('ann-xen')?.value||'';
  if(!a.title_de&&!a.title_en&&!a.text_de&&!a.text_en){toast(lang==='de'?'Bitte Titel oder Text eingeben.':'Please enter a title or text.');return;}
  a.id=Date.now();          // new id → everyone sees it again
  await saveShared();
  toast(lang==='de'?'Mitteilung gespeichert.':'Announcement saved.',true);
  navigate('admin');
}
async function toggleMaintenance(){
  if(!SHARED.maintenance)SHARED.maintenance={active:false,msg_de:'',msg_en:''};
  const willActivate=!SHARED.maintenance.active;
  const isDE=lang==='de';
  if(willActivate&&!confirm(isDE?'Wartungsmodus aktivieren? Normale Nutzer können sich dann nicht mehr einloggen.':'Activate maintenance mode? Regular users will no longer be able to log in.'))return;
  SHARED.maintenance.active=willActivate;
  await saveShared();
  toast(willActivate?(isDE?'Wartungsmodus aktiviert.':'Maintenance mode activated.'):(isDE?'Wartungsmodus deaktiviert.':'Maintenance mode deactivated.'),!willActivate);
  navigate('admin');
}
async function saveMaintMsg(){
  if(!SHARED.maintenance)SHARED.maintenance={active:false,msg_de:'',msg_en:''};
  SHARED.maintenance.msg_de=document.getElementById('maint-de')?.value||'';
  SHARED.maintenance.msg_en=document.getElementById('maint-en')?.value||'';
  await saveShared();
  toast(lang==='de'?'Hinweistext gespeichert.':'Notice text saved.',true);
}

function moveArr(arr,idx,dir){const j=idx+dir;if(j<0||j>=arr.length)return false;const tmp=arr[idx];arr[idx]=arr[j];arr[j]=tmp;return true;}
async function moveFAQ(id,dir){
  const de=SHARED.faq.de,en=SHARED.faq.en;
  const i=de.findIndex(f=>f.id===id);if(i<0)return;
  if(!moveArr(de,i,dir))return;
  // keep the English list in the same order (match by id)
  const order=de.map(f=>f.id);
  SHARED.faq.en=order.map(oid=>en.find(f=>f.id===oid)).filter(Boolean).concat(en.filter(f=>!order.includes(f.id)));
  await saveShared();navigate('hilfe');setTimeout(()=>swH('faq'),50);
}
async function moveRM(id,dir){
  const i=SHARED.roadmap.findIndex(r=>r.id===id);if(i<0)return;

}

async function saveRM(id){
  const tde=document.getElementById('rm-ti-de')?.value?.trim()||'';
  const ten=document.getElementById('rm-ti-en')?.value?.trim()||'';
  const dde=document.getElementById('rm-desc-de')?.value||'';
  const den=document.getElementById('rm-desc-en')?.value||'';
  const status=document.getElementById('rm-st')?.value||'planned';
  if(!tde&&!ten){toast(lang==='de'?'Bitte einen Titel eingeben.':'Please enter a title.');return;}
  const entry={title_de:tde||ten,title_en:ten||tde,desc_de:dde||den,desc_en:den||dde,status};
  if(id){SHARED.roadmap=SHARED.roadmap.map(r=>r.id===id?{id,...entry}:r);}
  else{SHARED.roadmap.push({id:Math.max(...SHARED.roadmap.map(r=>r.id),0)+1,...entry});}
  document.getElementById('rm-mo')?.remove();
  await saveShared();navigate('hilfe');setTimeout(()=>swH('rm'),50);
}

  </div></div>`);
}
async function saveCL(origVer){
  const ver=document.getElementById('cl-ver')?.value?.trim();
  const name=document.getElementById('cl-name')?.value?.trim()||'';
  const de=(document.getElementById('cl-de')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const en=(document.getElementById('cl-en')?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(!ver){toast(lang==='de'?'Bitte Version angeben.':'Please enter a version.');return;}
  if(!SHARED.changelog)SHARED.changelog=[];
  const entry={ver,name,de,en:en.length?en:de};
  if(origVer){SHARED.changelog=SHARED.changelog.map(e=>e.ver===origVer?entry:e);}
  else{SHARED.changelog=[entry,...SHARED.changelog];}
  document.getElementById('cl-mo')?.remove();
  await saveShared();
  navigate('hilfe');setTimeout(()=>swH('rm'),50);
}
async function delCL(ver){
  if(!confirm(t('confirm_del')))return;
  SHARED.changelog=(SHARED.changelog||[]).filter(e=>e.ver!==ver);
  await saveShared();
  navigate('hilfe');setTimeout(()=>swH('rm'),50);
}

function waPag(total,page,rbp){
  const pag=document.getElementById('wa-pag');if(!pag)return;const pages=Math.ceil(total/rbp);
  if(pages<=1){pag.innerHTML='';return;}
  const btn=(lbl,pg,dis,act)=>`<button class="btn ${act?'bp':'bg'} btn-sm" ${dis?'disabled':''} onclick="waFetch(${pg})" style="min-width:34px">${lbl}</button>`;
  let h=btn('←',page-1,page<=1,false);
  const s=Math.max(1,page-2),e=Math.min(pages,page+2);
  if(s>1)h+=btn('1',1,false,false)+(s>2?'<span style="color:var(--text3);padding:0 2px">…</span>':'');
  for(let i=s;i<=e;i++)h+=btn(i,i,false,i===page);
  if(e<pages)h+=(e<pages-1?'<span style="color:var(--text3);padding:0 2px">…</span>':'')+btn(pages,pages,false,false);
  h+=btn('→',page+1,page>=pages,false);
  pag.innerHTML=h;
}

function waCompFetch(page){page=page||1;WA_STATE.wcPage=page;const grid=document.getElementById('wc-grid');if(!grid)return;const cs=document.getElementById('wc-country');if(cs&&!cs.options.length){cs.innerHTML='<option value="">'+(lang==='de'?'Alle Nationen':'All countries')+'</option>'+[...WA_NOC].sort((a,b)=>a[1].localeCompare(b[1])).map(([code,name])=>`<option value="${code}">${name} (${code})</option>`).join('');}const search=(document.getElementById('wc-search')?.value||'').trim(),country=(document.getElementById('wc-country')?.value||'').toUpperCase(),sd=document.getElementById('wc-start')?.value,ed=document.getElementById('wc-end')?.value,status=document.getElementById('wc-status')?.value||'all',wre=document.getElementById('wc-wre')?.checked;WA_STATE.wcStart=sd;WA_STATE.wcEnd=ed;const n=document.getElementById('wa-notice');if(n)n.style.display='none';grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:28px;color:var(--text3)">⏳ ${lang==='de'?'Lade Wettkämpfe…':'Loading competitions…'}</div>`;const p=new URLSearchParams();if(search)p.set('fText',search);if(sd)p.set('StartDate',sd);if(ed)p.set('EndDate',ed);if(country)p.set('Country',country);if(wre)p.set('WorldRankingEvent','1');if(status==='live')p.set('Live','true');p.set('Cancelled','-1');p.set('SortBy','DATE');p.set('RBP',12);p.set('Page',page-1);fetch(WA_COMP+'?'+p.toString()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{let items=data.items||[];const total=(data.pageInfo&&data.pageInfo.totalResults)||items.length;const today=new Date();today.setHours(0,0,0,0);if(status==='upcoming')items=items.filter(x=>!x.IsLive&&new Date(x.DFrom)>today);else if(status==='finished')items=items.filter(x=>!x.IsLive&&new Date(x.DTo)<today);else if(status==='live')items=items.filter(x=>x.IsLive);const cnt=document.getElementById('wc-count');if(cnt)cnt.textContent=total.toLocaleString(lang==='de'?'de-DE':'en');grid.innerHTML=items.length?items.map(waCompCard).join(''):`<div style="grid-column:1/-1;color:var(--text3);padding:18px">${lang==='de'?'Keine Wettkämpfe gefunden.':'No competitions found.'}</div>`;waPagGeneric('wc-pag',total,page,12,'waCompFetch');}).catch(e=>{grid.innerHTML='';waNotice(e);console.error('WC',e);});}
async function waOpenComp(id){document.body.insertAdjacentHTML('beforeend',`<div class="mo" id="wc-mo" onclick="closeMo(event,'wc-mo')"><div class="md" style="width:540px;max-height:88vh;overflow-y:auto"><div class="mh"><div class="mt2">${lang==='de'?'Wettkampf':'Competition'}</div><button class="btn bg btn-sm" onclick="document.getElementById('wc-mo').remove()">✕</button></div><div id="wc-panel"><div style="text-align:center;padding:30px;color:var(--text3)">⏳ …</div></div></div></div>`);const pc=document.getElementById('wc-panel');try{const res=await fetch(WA_COMP+'?CompId='+id+'&Detailed=true');const data=await res.json();const c=(data.items||[])[0];if(!c)throw new Error('not found');const st=waCompStatus(c);const cats=[...new Set([...((c.CatInd||[]).map(x=>x.Code)),...((c.CatTeam||[]).map(x=>x.Code))])];pc.innerHTML=`<div style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">${c.Level||''}</div><div style="font-family:Bebas Neue,sans-serif;font-size:26px;line-height:1.1;color:var(--text);margin-bottom:4px">${c.Name}</div><div style="font-size:13px;color:var(--text2);margin-bottom:12px">${c.Venue?c.Venue+', ':''}${c.Place||''}${(c.CountryName||c.Country)?', '+(c.CountryName||c.Country):''}</div><div style="display:flex;gap:6px;margin-bottom:14px"><span class="badge" style="background:${st.c}22;color:${st.c};border:1px solid ${st.c}55">${st.l}</span>${c.WorldRankingEvent?'<span class="badge ba">WRE</span>':''}</div><div style="display:grid;grid-template-columns:90px 1fr;gap:6px;font-size:13px;color:var(--text2)"><span style="color:var(--text3);text-transform:uppercase;font-size:11px;padding-top:2px">${lang==='de'?'Datum':'Dates'}</span><span>${waFmtDate(c.DFrom)} – ${waFmtDate(c.DTo)}</span>${c.StatusDescription?`<span style="color:var(--text3);text-transform:uppercase;font-size:11px;padding-top:2px">Status</span><span>${c.StatusDescription}</span>`:''}</div>${cats.length?`<div style="margin-top:14px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:6px">${lang==='de'?'Kategorien':'Categories'}</div><div style="display:flex;gap:5px;flex-wrap:wrap">${cats.map(x=>`<span class="badge bbl">${x}</span>`).join('')}</div></div>`:''}${Array.isArray(c.Stages)&&c.Stages.length?`<div style="margin-top:14px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:6px">${lang==='de'?'Verfügbare Daten':'Available data'}</div><div style="display:flex;flex-direction:column;gap:5px">${c.Stages.map(s=>`<div style="display:flex;justify-content:space-between;font-size:13px;padding:7px 10px;background:var(--bg3);border-radius:6px"><span>${s}</span><span style="color:var(--green)">✓</span></div>`).join('')}</div></div>`:''}<div style="height:12px"></div>`;}catch(e){pc.innerHTML=`<div style="color:var(--text3);padding:20px">${lang==='de'?'Fehler':'Error'}: ${e.message}</div>`;console.error('WC panel',e);}}

// ── Records ──
function waCatLabel(c){return WA_CAT_LABELS[c]||c||'—';}
// Relevance order: senior individual → team/mixed → U21 → U18 → para → rest
function waCatRank(cat){
  const c2=String(cat||'').toUpperCase();
  if(c2.startsWith('P'))return 4;                       // para classes
  if(c2.includes('U18'))return 3;
  if(c2.includes('U21'))return 2;
  if(c2.includes('MX')||c2.includes('TEAM')||c2.endsWith('T'))return 1;
  if(['RM','RW','CM','CW','BM','BW'].includes(c2))return 0;
  return 5;
}
// The API's RecordStanding flag is unreliable (several rows report true).
// Derive the current record per group: highest score, then most X's, then newest date.
function waMarkStanding(items){
  const groups={};
  items.forEach(r=>{const k=[r.RecordDiscipline,r.Cat,r.IsTeam?1:0,waRecEvent(r)].join('|');(groups[k]=groups[k]||[]).push(r);r.__standing=false;});
  Object.values(groups).forEach(g=>{
    let best=null;
    g.forEach(r=>{
      if(!best){best=r;return;}
      const p=(+r.Points||0)-(+best.Points||0);
      if(p>0){best=r;return;}
      if(p===0){
        const x=(+r.Xs||0)-(+best.Xs||0);
        if(x>0){best=r;return;}
        if(x===0&&new Date(r.Date||0)>new Date(best.Date||0))best=r;
      }
    });
    if(best)best.__standing=true;
  });
  return items;
}
function waDiscLabel(id){return WA_DISC[id]||(id!=null?'Discipline '+id:'Records');}
function waFmtArcher(a){if(!a)return '';const fn=a.FName||'',gn=a.GName||'';if(fn||gn)return (a.WNameOrd?fn+' '+gn:gn+' '+fn).trim();return (a.Name||'').trim();}
function waRecHolders(r){const ar=r.Archers;if(Array.isArray(ar))return ar.map(waFmtArcher).filter(Boolean).join(' / ')||'—';if(ar&&typeof ar==='object')return waFmtArcher(ar)||'—';return '—';}
function waRecEvent(r){return [r.RecordName||'',r.RecordSubName||''].filter(Boolean).join(' · ')||'—';}
function waRecComp(r){const c=r.Competition;if(c&&typeof c==='object'){const nm=c.Name||'',loc=[c.Place,c.Country].filter(Boolean).join(', ');return [nm,loc].filter(Boolean).join(' · ')||'—';}return '—';}
function waRecSortFn(){const s=WA_STATE.recSort;
  if(s==='date_desc')return (a,b)=>new Date(b.Date||0)-new Date(a.Date||0);
  if(s==='date_asc')return (a,b)=>new Date(a.Date||0)-new Date(b.Date||0);
  return (a,b)=>{if(!!b.__standing!==!!a.__standing)return (b.__standing?1:0)-(a.__standing?1:0);return (b.Points||0)-(a.Points||0);};}
function waGroupRecords(items){const g={};items.forEach(r=>{const disc=waDiscLabel(r.RecordDiscipline),cat=r.Cat||'',key=disc+'||'+cat;if(!g[key])g[key]={cat,label:waCatLabel(cat),items:[]};g[key].items.push(r);});const sf=waRecSortFn();Object.values(g).forEach(x=>x.items.sort(sf));return Object.values(g).sort((a,b)=>{const ra=waCatRank(a.cat),rb=waCatRank(b.cat);if(ra!==rb)return ra-rb;return String(a.label).localeCompare(b.label);});}
function waRecRows(items){return items.map(r=>{
  const ev=waRecEvent(r),sc=(r.Points!=null?r.Points:'—'),xs=(r.Xs>0?` <span style="font-size:10px;color:var(--text3)">(${r.Xs}X)</span>`:''),hold=waRecHolders(r),noc=r.NOC||'',comp=waRecComp(r),date=r.Date?waFmtDate(r.Date):'—';
  const standing=!!r.__standing;
  const rowStyle=standing
    ? 'background:linear-gradient(90deg,rgba(232,160,32,0.14),rgba(232,160,32,0.04));border-left:3px solid var(--accent)'
    : 'opacity:0.62';
  const badge=standing
    ? `<span class="badge ba" style="font-size:10px;margin-left:6px">${lang==='de'?'aktuell':'standing'}</span>`
    : `<span class="badge" style="font-size:10px;margin-left:6px;background:var(--bg4);color:var(--text3);border:1px solid var(--border)" title="${lang==='de'?'überholt':'superseded'}">${lang==='de'?'überholt':'superseded'}</span>`;
  return `<tr style="${rowStyle}"><td style="font-weight:600;color:var(--text)">${ev}${badge}</td><td style="font-family:Bebas Neue,sans-serif;font-size:16px;color:${standing?'var(--accent)':'var(--text2)'}">${sc}${xs}</td><td>${hold}</td><td style="color:var(--text3)">${noc}</td><td style="color:var(--text3);font-size:12px">${comp}</td><td style="color:var(--text3);white-space:nowrap">${date}</td></tr>`;}).join('');}
function waRenderRecGroups(groups){return groups.map(g=>`<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px">${g.label||g.cat||'Records'}${g.cat&&g.cat!==g.label?` <span style="color:var(--text3);font-weight:400;font-size:11px">(${g.cat})</span>`:''}</div><div style="overflow-x:auto"><table class="table"><thead><tr><th>Event</th><th>Score</th><th>${lang==='de'?'Athlet(en)':'Athlete(s)'}</th><th>NOC</th><th>${lang==='de'?'Wettkampf':'Competition'}</th><th>${lang==='de'?'Datum':'Date'}</th></tr></thead><tbody>${waRecRows(g.items)}</tbody></table></div></div>`).join('');}
function waRenderRecTable(items,title){const indiv=items.filter(r=>r.IsTeam!==true),team=items.filter(r=>r.IsTeam===true);const ig=waGroupRecords(indiv),tg=waGroupRecords(team);return `<div class="card"><div class="ch"><div class="ct">${title}</div><span class="badge bbl">${items.length}</span></div>${ig.length?`<div style="font-size:12px;font-weight:700;color:var(--text2);margin:6px 0 10px">🎯 ${lang==='de'?'Einzel':'Individual'} (${indiv.length})</div>${waRenderRecGroups(ig)}`:''}${tg.length?`<div style="font-size:12px;font-weight:700;color:var(--text2);margin:16px 0 10px">👥 Team (${team.length})</div>${waRenderRecGroups(tg)}`:''}</div>`;}
function waRecControls(){const mode=WA_STATE.recMode||'world';const catOpts='<option value="">'+(lang==='de'?'Alle Kategorien':'All categories')+'</option>'+Object.entries(WA_CAT_LABELS).map(([k,v])=>`<option value="${k}">${v} (${k})</option>`).join('');const lvlOpts=Object.entries(WA_REC_LEVELS).filter(([k])=>k!=='4').map(([k,v])=>`<option value="${k}"${k==='1'?' selected':''}>${v}</option>`).join('');const nocOpts='<option value="">'+(lang==='de'?'Alle Nationen':'All countries')+'</option>'+[...WA_NOC].sort((a,b)=>a[1].localeCompare(b[1])).map(([code,name])=>`<option value="${code}">${name} (${code})</option>`).join('');return`<div class="tabs" style="margin-bottom:12px"><div class="tab${mode==='world'?' active':''}" onclick="waRecSwitchMode('world')">${lang==='de'?'Weltrekorde':'World records'}</div><div class="tab${mode==='national'?' active':''}" onclick="waRecSwitchMode('national')">${lang==='de'?'Nationalrekorde':'National records'}</div></div><div class="card" style="margin-bottom:14px">${mode==='world'?`<div class="g2" style="gap:10px"><div class="fg" style="margin-bottom:0"><label>Level</label><select id="wr-level">${lvlOpts}</select></div><div class="fg" style="margin-bottom:0"><label>${lang==='de'?'Kategorie':'Category'}</label><select id="wr-cat">${catOpts}</select></div></div><button class="btn bp btn-sm" style="margin-top:10px" onclick="waFetchWorldRecords()">${lang==='de'?'Anzeigen':'Show'}</button>`:`<div class="g3" style="gap:10px"><div class="fg" style="margin-bottom:0"><label>${lang==='de'?'Nation':'Country'}</label><select id="nr-noc" onchange="waNrCountryChanged()">${nocOpts}</select></div><div class="fg" style="margin-bottom:0"><label id="nr-event-lbl">${lang==='de'?'Event-Art':'Event type'}</label><select id="nr-event"><option value="">${lang==='de'?'Alle Event-Arten':'All event types'}</option>${WA_REC_EVENT_CACHE.map(e=>`<option value="${e.replace(/"/g,'&quot;')}">${e}</option>`).join('')}</select></div><div class="fg" style="margin-bottom:0"><label>${lang==='de'?'Kategorie':'Category'}</label><select id="nr-cat">${catOpts}</select></div></div><div id="nr-hint" style="font-size:12px;color:var(--text3);margin-top:8px">${lang==='de'?'Wähle mindestens eine Nation oder eine Event-Art.':'Select at least a country or an event type.'}</div><button class="btn bp btn-sm" style="margin-top:10px" onclick="waFetchNationalRecords()">${lang==='de'?'Anzeigen':'Show'}</button>`}</div>`;}
function waRecInit(){
  if((WA_STATE.recMode||'world')==='world'){waFetchWorldRecords();}
  else{waEnsureEventCatalogue();waNrCountryChanged();}
}
function waNrCountryChanged(){
  const noc=(document.getElementById('nr-noc')?.value||'').trim();
  const lbl=document.getElementById('nr-event-lbl'),hint=document.getElementById('nr-hint');
  const required=!noc;
  if(lbl)lbl.innerHTML=(lang==='de'?'Event-Art':'Event type')+(required?' <span style="color:var(--accent)">*</span>':'');
  if(hint)hint.textContent=required
    ? (lang==='de'?'Ohne Nation ist eine Event-Art erforderlich (sonst würden sehr viele Rekorde geladen).':'Without a country, an event type is required (otherwise a very large set would load).')
    : (lang==='de'?'Event-Art ist optional.':'Event type is optional.');
}
function waEnsureEventCatalogue(){
  if(WA_REC_EVENT_CACHE.length)return;
  fetch(WA_REC+'?RecordLevelId=1&RBP=All').then(r=>r.ok?r.json():{items:[]}).then(data=>{
    const set=new Set();(data.items||[]).forEach(r=>{const e=waRecEvent(r);if(e&&e!=='—')set.add(e);});
    WA_REC_EVENT_CACHE=[...set].sort((a,b)=>a.localeCompare(b));
    const sel=document.getElementById('nr-event');
    if(sel&&WA_REC_EVENT_CACHE.length){const cur=sel.value;sel.innerHTML=`<option value="">${lang==='de'?'Alle Event-Arten':'All event types'}</option>`+WA_REC_EVENT_CACHE.map(e=>`<option value="${e.replace(/"/g,'&quot;')}">${e}</option>`).join('');sel.value=cur;}
  }).catch(e=>console.warn('event catalogue',e));
}
function waRecSwitchMode(m){WA_STATE.recMode=m;navigate('wa');}
function waDefaultEvent(){
  const evs=waRecEventList();
  const pick=evs.find(e=>/70\s*m/i.test(e)&&/72/.test(e))||evs.find(e=>/70\s*m/i.test(e));
  return pick||'';
}
function waRecEventList(){const set=new Set();WA_REC_ITEMS.forEach(r=>{const e=waRecEvent(r);if(e&&e!=='—')set.add(e);});return [...set].sort((a,b)=>a.localeCompare(b));}
function waSetRecEvent(v){WA_STATE.recEvent=v;waRenderRecArea();}
function waSetRecSort(v){WA_STATE.recSort=v;waRenderRecArea();}
function waRecFilterBar(){
  const evs=waRecEventList();
  const evOpts='<option value="">'+(lang==='de'?'Alle Event-Arten':'All event types')+'</option>'+evs.map(e=>`<option value="${e.replace(/"/g,'&quot;')}"${WA_STATE.recEvent===e?' selected':''}>${e}</option>`).join('');
  const s=WA_STATE.recSort;
  return`<div class="card" style="margin-bottom:12px"><div class="g2" style="gap:10px">
    <div class="fg" style="margin-bottom:0"><label>${lang==='de'?'Event-Art':'Event type'}</label><select onchange="waSetRecEvent(this.value)">${evOpts}</select></div>
    <div class="fg" style="margin-bottom:0"><label>${lang==='de'?'Sortierung':'Sort by'}</label><select onchange="waSetRecSort(this.value)">
      <option value="score"${s==='score'?' selected':''}>${lang==='de'?'Punktzahl (gültige zuerst)':'Score (standing first)'}</option>
      <option value="date_desc"${s==='date_desc'?' selected':''}>${lang==='de'?'Datum – neueste zuerst':'Date – newest first'}</option>
      <option value="date_asc"${s==='date_asc'?' selected':''}>${lang==='de'?'Datum – älteste zuerst':'Date – oldest first'}</option>
    </select></div>
  </div></div>`;
}
function waRenderRecArea(){
  const area=document.getElementById('wr-area');if(!area)return;
  if(!WA_REC_ITEMS.length){area.innerHTML=`<div class="card"><div style="color:var(--text3);padding:20px">${lang==='de'?'Keine Rekorde gefunden.':'No records found.'}</div></div>`;return;}
  let items=WA_REC_ITEMS;
  if(WA_STATE.recEvent)items=items.filter(r=>waRecEvent(r)===WA_STATE.recEvent);
  const hint=(!WA_STATE.recEvent&&items.length>300)?`<div style="background:#4a9eff12;border:1px solid #4a9eff30;border-radius:10px;padding:10px 13px;margin-bottom:12px;font-size:12.5px;color:var(--text2)">ℹ️ ${lang==='de'?`${items.length} Rekorde geladen. Wähle oben eine Event-Art (z. B. „70m Round · 72 arrows"), um die Liste einzugrenzen.`:`${items.length} records loaded. Pick an event type above (e.g. "70m Round · 72 arrows") to narrow the list.`}</div>`:'';
  area.innerHTML=waRecFilterBar()+hint+(items.length?waRenderRecTable(items,WA_STATE.recTitle||'Records'):`<div class="card"><div style="color:var(--text3);padding:20px">${lang==='de'?'Keine Rekorde für diese Event-Art.':'No records for this event type.'}</div></div>`);
}
function waFetchWorldRecords(){
  const level=document.getElementById('wr-level')?.value||'1',cat=document.getElementById('wr-cat')?.value||'';
  const area=document.getElementById('wr-area');if(!area)return;
  area.innerHTML=`<div class="card"><div style="text-align:center;padding:26px;color:var(--text3)">⏳ ${lang==='de'?'Lade Rekorde…':'Loading records…'}</div></div>`;
  const p=new URLSearchParams();p.set('RecordLevelId',level);p.set('RBP','All');if(cat)p.set('Cat',cat);
  fetch(WA_REC+'?'+p.toString()).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(data=>{
    let items=data.items||[];if(cat)items=items.filter(r=>String(r.Cat||'')===cat);
    WA_REC_ITEMS=waMarkStanding(items);
    WA_STATE.recEvent=waDefaultEvent();
    WA_STATE.recTitle=(WA_REC_LEVELS[level]||'Records');
    waRenderRecArea();
  }).catch(e=>{area.innerHTML=`<div class="card"><div style="color:var(--text3);padding:20px">${lang==='de'?'Fehler':'Error'}: ${e.message}</div></div>`;console.error('WR',e);});
}
function waFetchNationalRecords(){
  const noc=(document.getElementById('nr-noc')?.value||'').toUpperCase();
  const cat=document.getElementById('nr-cat')?.value||'';
  const ev=(document.getElementById('nr-event')?.value||'').trim();
  const area=document.getElementById('wr-area');if(!area)return;
  // Guard: without a country an event type is mandatory (avoids loading everything)
  if(!noc&&!ev){
    toast(lang==='de'?'Bitte eine Nation oder eine Event-Art wählen.':'Please select a country or an event type.');
    const sel=document.getElementById('nr-event');if(sel){sel.style.borderColor='var(--accent)';setTimeout(()=>{sel.style.borderColor='';},1600);sel.focus();}
    return;
  }
  area.innerHTML=`<div class="card"><div style="text-align:center;padding:26px;color:var(--text3)">⏳ ${lang==='de'?'Lade Rekorde…':'Loading records…'}</div></div>`;
  const p=new URLSearchParams();p.set('RecordLevelId','4');p.set('RBP','All');if(noc)p.set('NOC',noc);if(cat)p.set('Cat',cat);
  fetch(WA_REC+'?'+p.toString()).then(r=>r.ok?r.json():{items:[]}).then(data=>{
    let items=data.items||[];
    if(noc)items=items.filter(r=>String(r.NOC||'').toUpperCase()===noc);
    if(cat)items=items.filter(r=>String(r.Cat||'')===cat);
    if(ev)items=items.filter(r=>waRecEvent(r)===ev);
    WA_REC_ITEMS=waMarkStanding(items);WA_STATE.recEvent=ev||'';
    WA_STATE.recTitle=(lang==='de'?'Nationalrekorde':'National records')
      +(noc?' — '+noc:(lang==='de'?' — alle Nationen':' — all countries'))
      +(ev?' · '+ev:'');
    waRenderRecArea();
  }).catch(e=>{area.innerHTML=`<div class="card"><div style="color:var(--text3);padding:20px">${lang==='de'?'Fehler':'Error'}: ${e.message}</div></div>`;console.error('NR',e);});
}

// ── Login notices: announcement for everyone, digest for admins ──
function annDismissed(id){try{return String(localStorage.getItem('bb_ann_seen')||'')===String(id);}catch(e){return false;}}
function dismissAnn(id){try{localStorage.setItem('bb_ann_seen',String(id));}catch(e){}document.getElementById('ann-card')?.remove();}
let ADMIN_LAST_SEEN=null;
async function readAdminLastSeen(){
  // Preferred: profile column (works across devices). Fallback: this browser.
  if(ADMIN_LAST_SEEN)return ADMIN_LAST_SEEN;
  try{const v=localStorage.getItem('bb_admin_last_seen');return v||null;}catch(e){return null;}
}
async function writeAdminLastSeen(iso){
  ADMIN_LAST_SEEN=iso;
  try{localStorage.setItem('bb_admin_last_seen',iso);}catch(e){}
  try{
    const {error}=await sbc.from('profiles').update({admin_last_seen:iso}).eq('id',CU.id);
    if(error)console.warn('admin_last_seen not stored centrally (run the SQL migration):',error.message);
  }catch(e){console.warn('admin_last_seen',e);}
}
function adminDigestOn(){try{return localStorage.getItem('bb_admin_digest')!=='off';}catch(e){return true;}}
function setAdminDigest(on){try{localStorage.setItem('bb_admin_digest',on?'on':'off');}catch(e){}toast(on?(lang==='de'?'Login-Zusammenfassung aktiviert.':'Login summary enabled.'):(lang==='de'?'Login-Zusammenfassung deaktiviert.':'Login summary disabled.'),true);navigate('admin');}
function noticeCard(id,icon,title,body,accent){
  return `<div class="card fade-in" id="${id}" style="margin-bottom:14px;border-left:3px solid ${accent}">
    <div style="display:flex;align-items:flex-start;gap:10px">
      <div style="font-size:19px;line-height:1.2;flex-shrink:0">${icon}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px">${title}</div>
        <div style="font-size:12.5px;color:var(--text2);line-height:1.6">${body}</div>
      </div>
      <button onclick="document.getElementById('${id}')?.remove()" title="${lang==='de'?'Ausblenden':'Dismiss'}" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex-shrink:0">✕</button>
    </div>
  </div>`;
}
async function showLoginNotices(){
  const host=document.getElementById('content');
  if(!host||currentPage!=='dashboard')return;
  let html='';
  // 1) Announcement from the admin (everyone, once per announcement)
  const a=SHARED.announcement;
  if(a&&a.active&&!annDismissed(a.id)){
    const title=(lang==='en'?(a.title_en||a.title_de):(a.title_de||a.title_en))||(lang==='de'?'Neuigkeit':'Announcement');
    const text=(lang==='en'?(a.text_en||a.text_de):(a.text_de||a.text_en))||'';
    html+=`<div class="card fade-in" id="ann-card" style="margin-bottom:14px;border-left:3px solid var(--accent)">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <div style="font-size:19px;flex-shrink:0">📣</div>
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px">${title}</div>
        <div style="font-size:12.5px;color:var(--text2);line-height:1.6;white-space:pre-wrap">${text}</div></div>
        <button onclick="dismissAnn('${a.id}')" title="${lang==='de'?'Nicht mehr anzeigen':'Do not show again'}" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex-shrink:0">✕</button>
      </div></div>`;
  }
  // 2) Admin digest (private, optional)
  if(CU&&CU.role==='admin'&&adminDigestOn()){
    try{
      const since=await readAdminLastSeen();
      const {data:profs}=await sbc.from('profiles').select('created_at');
      const newUsers=since?(profs||[]).filter(p=>p.created_at&&new Date(p.created_at)>new Date(since)).length:0;
      const unread=(SHARED.feedback||[]).filter(f=>!f.read).length;
      if(newUsers||unread){
        const parts=[];
        if(newUsers)parts.push(lang==='de'?`<strong>${newUsers}</strong> neue Registrierung${newUsers>1?'en':''}`:`<strong>${newUsers}</strong> new signup${newUsers>1?'s':''}`);
        if(unread)parts.push(lang==='de'?`<strong>${unread}</strong> ungelesene${unread>1?' Feedbacks':'s Feedback'}`:`<strong>${unread}</strong> unread feedback`);
        const body=parts.join(lang==='de'?' · ':' · ')+` <a onclick="navigate('admin')" style="color:var(--accent);cursor:pointer;text-decoration:underline">${lang==='de'?'Zum Admin-Bereich':'Open admin area'}</a>`;
        html+=noticeCard('digest-card','🔔',(lang==='de'?'Seit deinem letzten Besuch':'Since your last visit'),body,'var(--blue)');
      }
      await writeAdminLastSeen(new Date().toISOString());
    }catch(e){console.warn('digest',e);}
  }
  if(html)host.insertAdjacentHTML('afterbegin',html);
}
// ── Session bootstrap + password-recovery handling ──
let _recovering=false;
try{const _l=localStorage.getItem('bb_lang');if(_l==='de'||_l==='en')lang=_l;}catch(e){}
renderLoginBody();
if(sbc){
  sbc.auth.onAuthStateChange((event,session)=>{
    if(event==='PASSWORD_RECOVERY'){_recovering=true;showSetNewPassword();}
  });
  (async()=>{
    try{
      // If arriving via recovery link, the hash contains type=recovery
      if(location.hash.includes('type=recovery')){_recovering=true;showSetNewPassword();return;}
      await checkMaintenance();
      const {data}=await sbc.auth.getSession();
      if(data&&data.session){await afterAuth(data.session,false);}
    }catch(e){console.error('session init',e);}
  })();
}else{
  const er=document.getElementById('lerr');if(er){er.style.display='block';er.textContent='Supabase-SDK konnte nicht geladen werden. Internetverbindung prüfen.';}
}
</script>
