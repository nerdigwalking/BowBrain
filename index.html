
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--bg4:#252b3b;
--accent:#e8a020;--a2:#f0c060;--green:#2dd4a0;--red:#e85050;--blue:#4a9eff;
--text:#f0f0f0;--text2:#9aa0b8;--text3:#6a7090;
--border:#2a3050;--bd2:#3a4060;--card:#1e2333;
font-family:'Inter',sans-serif;font-size:14px;
}
body.light{--bg:#eef1f8;--bg2:#ffffff;--bg3:#f4f6fc;--bg4:#e8ecf5;--text:#1a1e30;--text2:#4a5272;--text3:#7a8aaa;--border:#c5cce6;--bd2:#a5b0d0;--card:#ffffff}
body.large-font{font-size:15.5px}
body.compact .card,.compact .card-sm{padding:12px 14px}
body.compact .content{padding:14px}
body.no-anim *{transition:none!important;animation:none!important}
body{background:var(--bg);color:var(--text);min-height:100vh}
.lp{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.lbg{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,#e8a02018 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,#4a9eff10 0%,transparent 45%);pointer-events:none}
.lbox{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:36px 30px;width:400px;max-width:95vw;position:relative;z-index:1}
.llogo{display:flex;align-items:center;gap:12px;margin-bottom:26px;justify-content:center}
.lico{width:46px;height:46px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lico svg{width:28px;height:28px;fill:#0f1117}
.ltit{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--accent)}
.lver{font-size:11px;color:var(--text3);text-align:center;margin-top:-4px;margin-bottom:24px;letter-spacing:0.5px}
.lerr{background:#e8505018;border:1px solid #e8505040;color:var(--red);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px;display:none}
.ldemo{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:16px;font-size:11.5px;color:var(--text3)}
.ldemo b{color:var(--accent)}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:100;transition:transform .3s}
.sidebar.collapsed{transform:translateX(-220px)}
.main{margin-left:220px;flex:1;min-height:100vh;transition:margin .3s}
.main.exp{margin-left:0}
.logo{padding:18px 14px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:22px;height:22px;fill:var(--bg)}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--accent)}
.logo-ver{font-size:10px;color:var(--text3);letter-spacing:0.3px}
.nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:linear-gradient(90deg,#e8a020,#f0c060);color:#0f1117;font-weight:700}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-sep{height:1px;background:var(--border);margin:6px 0}
.nav-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:3px 10px 5px;font-weight:600}
.sf{padding:10px 8px;border-top:1px solid var(--border)}
.uc{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;cursor:pointer;background:var(--bg3)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0f1117;flex-shrink:0}
.topbar{height:54px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50}
.tbt{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;color:var(--accent);flex:1}
.tbb{background:var(--bg4);border:1px solid var(--border);border-radius:20px;padding:3px 11px;font-size:11px;color:var(--text2);font-weight:500}
.mb{background:none;border:none;color:var(--text2);cursor:pointer;padding:5px;border-radius:6px;display:flex}
.mb:hover{background:var(--bg3);color:var(--text)}
.content{padding:20px;max-width:1200px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ct{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px}
.cv{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--text);letter-spacing:1px}
.cs{font-size:12px;color:var(--text3);margin-top:2px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif}
.bp{background:var(--accent);color:#0f1117}.bp:hover{background:var(--a2)}
.bg{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}.bg:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.bd{background:transparent;color:var(--red);border:1px solid #e8505030}.bd:hover{background:#e8505018}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.ba{background:#e8a02030;color:var(--accent);border:1px solid #e8a02050}
.bgr{background:#2dd4a020;color:var(--green);border:1px solid #2dd4a030}
.brd{background:#e8505020;color:var(--red);border:1px solid #e8505030}
.bbl{background:#4a9eff20;color:var(--blue);border:1px solid #4a9eff30}
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--border)}
.ti{position:relative;margin-bottom:18px}
.tdot{position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg2);z-index:1}
.dg{background:var(--accent)}.dgr{background:var(--green)}.db{background:var(--blue)}
.tc{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.progress{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden}
.pf{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--a2))}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.7px;color:var(--text3);padding:7px 10px;border-bottom:1px solid var(--border)}
.table td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--bg3);color:var(--text)}
.fg{margin-bottom:12px}
label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
input,select,textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--bg3)}
textarea{min-height:70px;resize:vertical}
.tabs{display:flex;gap:3px;margin-bottom:18px;background:var(--bg3);padding:3px;border-radius:10px}
.tab{flex:1;padding:6px 10px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;text-align:center;transition:all .15s;border:none;background:none;font-family:'Inter',sans-serif}
.tab.active{background:var(--bg);color:var(--text);font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.md{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px;width:520px;max-width:95vw;max-height:88vh;overflow-y:auto}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mt{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1px;color:var(--accent)}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;color:var(--text);margin-bottom:18px}
.ssub{font-size:13px;color:var(--text3);margin-top:-14px;margin-bottom:18px}
.empty{text-align:center;padding:36px 20px;color:var(--text3)}
.ei{font-size:44px;margin-bottom:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.toggle{width:38px;height:22px;border-radius:11px;background:var(--bg4);border:1px solid var(--border);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on::after{left:19px}
.ndot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;margin-left:auto}
.vtag{position:fixed;bottom:10px;right:10px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:10px;color:var(--text3);z-index:300}
.tcard{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.tcti{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:8px}
.gi{padding:10px 0;border-bottom:1px solid var(--border)}
.gi:last-child{border-bottom:none}
.gterm{font-weight:700;color:var(--accent);font-size:14px;margin-bottom:4px}
.gdef{font-size:13px;color:var(--text2);line-height:1.6}
.faq-item{border:1px solid var(--border);border-radius:10px;margin-bottom:7px;overflow:hidden}
.faq-q{padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;color:var(--text)}
.faq-a{padding:0 14px 10px;font-size:13px;color:var(--text2);line-height:1.65;display:none}
.faq-item.open .faq-a{display:block}
.fq{transition:transform .2s;color:var(--text3)}
.faq-item.open .fq{transform:rotate(180deg)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photo-card{background:var(--bg4);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.photo-card img{width:100%;height:86px;object-fit:cover}
.pmeta{padding:5px 7px;font-size:11px;color:var(--text2)}
.pdate{color:var(--text3);font-size:10px;margin-bottom:1px}
.pdel{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.55);border:none;color:#fff;width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
</style>
</head>

const nextId=arr=>arr.length?Math.max(...arr.map(x=>x.id))+1:1;
const fd=d=>{if(!d)return'—';const p=d.split('-');return`${p[2]}.${p[1]}.${p[0]}`};
const sName=s=>[s.prefix,s.bow,s.dw+'#',s.am,s.spine].filter(Boolean).join(' · ');
const getSName=id=>{const s=getD().setups.find(x=>x.id===id);return s?sName(s):'—'};

const avgArr=(p,a)=>(!a||a===0)?'—':(p/a).toFixed(1);

function recSpine(dw,dl,tip){
  return Math.round((1600-(dw*27)-(dl-28)*30-(tip-100)*1.5)/50)*50;
}
function spineChk(spine,dw,dl,tip){
  const rec=recSpine(dw||36,dl||28,tip||100),diff=spine-rec;
  if(Math.abs(diff)<75)return{c:'var(--green)',tx:`✅ ${lang==='de'?'Passend':'Good match'} (~${rec})`};
  if(diff<0)return{c:'var(--blue)',tx:`ℹ️ ${lang==='de'?'Eher steif':'Rather stiff'} (~${rec})`};
  return{c:'var(--accent)',tx:`⚠️ ${lang==='de'?'Eher schwach':'Rather weak'} (~${rec})`};
}
function applySettings(s){
  const B=document.body;
  B.classList.toggle('light',!s.dark_mode);

}

function drawSightChart(){
  const cv=document.getElementById('sight-canvas');if(!cv)return;
  const as=getAS();
  const pts=as?getD().sight.filter(s=>s.setup_id===as.id).sort((a,b)=>a.dist-b.dist):[];
  const ctx=cv.getContext('2d');
  const W=cv.offsetWidth||680,H=200;
  cv.width=W*2;cv.height=H*2;ctx.scale(2,2);
  ctx.clearRect(0,0,W,H);
  const ml=48,mr=18,mt=22,mb=28,cW=W-ml-mr,cH=H-mt-mb;
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;
  for(let i=0;i<=5;i++){const y=mt+i*cH/5;ctx.beginPath();ctx.moveTo(ml,y);ctx.lineTo(W-mr,y);ctx.stroke();}
  const maxD=Math.max(...(pts.map(s=>s.dist)||[]),70,1);
  // Realistic parabola: h(xn) = 0.85 + 0.5*xn - 1.25*xn² → peak at xn≈0.2, drops to 0.1 at xn=1
  const getH=xn=>Math.max(0.02,Math.min(0.98,0.85+0.5*xn-1.25*xn*xn));
  const toX=d2=>ml+(d2/maxD)*cW;
  const toY=xn=>mt+(1-getH(xn))*cH;
  // Gradient fill
  const grad=ctx.createLinearGradient(0,mt,0,mt+cH);
  grad.addColorStop(0,'rgba(232,160,32,0.12)');grad.addColorStop(1,'rgba(232,160,32,0)');
  ctx.beginPath();
  for(let i=0;i<=100;i++){const xn=i/100;const x=ml+xn*cW;const y=toY(xn);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.lineTo(ml+cW,mt+cH);ctx.lineTo(ml,mt+cH);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  // Trajectory line
  ctx.shadowColor='rgba(232,160,32,0.4)';ctx.shadowBlur=6;
  ctx.beginPath();ctx.strokeStyle='#e8a020';ctx.lineWidth=2.5;
  for(let i=0;i<=100;i++){const xn=i/100;const x=ml+xn*cW;const y=toY(xn);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();ctx.shadowBlur=0;
  // Ground line
  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ml,mt+cH);ctx.lineTo(W-mr,mt+cH);ctx.stroke();
  // Distance markers
  if(pts.length>0){
    ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='center';
    pts.forEach(s=>{
      const xn=s.dist/maxD,x=toX(s.dist),y=toY(xn);
      ctx.fillStyle='#e8a020';ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f0c060';ctx.fillText(s.dist+'m',x,y-10);
      ctx.fillStyle='rgba(154,160,184,0.85)';ctx.fillText('↕'+s.click,x,y+19);
      ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(x,y+8);ctx.lineTo(x,mt+cH);ctx.stroke();ctx.setLineDash([]);
    });
  } else {
    ctx.fillStyle='rgba(106,112,144,0.7)';ctx.font='13px Inter,sans-serif';ctx.textAlign='center';
    ctx.fillText(t('no_sight'),W/2,H/2);
  }
  ctx.fillStyle='rgba(106,112,144,0.6)';ctx.font='10px Inter,sans-serif';ctx.textAlign='left';
  ctx.fillText(lang==='de'?'← Abschuss':'← Release',ml+4,mt+cH-4);
  ctx.textAlign='right';ctx.fillText(lang==='de'?'Distanz →':'Distance →',W-mr,mt+cH-4);
}

function swTuning(id){
  ['bs','wb','pp','nt','ph'].forEach(k=>{
    const el=document.getElementById('tc-'+k);if(el)el.style.display=k===id?'':'none';
    const tab=document.getElementById('tab-'+k);if(tab)tab.classList.toggle('active',k===id);
  });
}
function saveTuningNotes(){
  const el=document.getElementById('tn-ta');if(!el)return;
  getD().tuning_notes=el.value;
  const btn=document.querySelector('[onclick="saveTuningNotes()"]');
  if(btn){btn.textContent='✅ '+t('save');setTimeout(()=>{btn.textContent=t('save')},1500);}
}
function addPhoto(input){
  if(!input.files||!input.files[0])return;
  const comment=document.getElementById('ph-comment')?.value||'';
  const reader=new FileReader();
  reader.onload=e=>{
    const photos=getD().tuning_photos;
    photos.push({id:nextId(photos),dataUrl:e.target.result,date:new Date().toLocaleDateString(lang==='de'?'de-DE':'en-GB'),comment});
    document.getElementById('ph-comment').value='';
    navigate('tuning');setTimeout(()=>swTuning('ph'),50);
  };
  reader.readAsDataURL(input.files[0]);
}
function delPhoto(id){if(!confirm(t('confirm_del')))return;getD().tuning_photos=getD().tuning_photos.filter(p=>p.id!==id);navigate('tuning');setTimeout(()=>swTuning('ph'),50);}

function rGlossar(){

function filtGlossar(){
  const q=(document.getElementById('g-s')?.value||'').toLowerCase();
